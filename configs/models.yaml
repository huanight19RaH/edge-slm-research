# Experiment Matrix: Models & Quantization Formats
models:
  qwen2.5-3b-instruct:
    hf_repo: "Qwen/Qwen2.5-3B-Instruct"
    parameters: "3B"
    runtimes:
      cpu_llamacpp:
        format: "gguf"
        quantizations: ["Q8_0", "Q4_K_M"]
      npu_rkllm:
        format: "rkllm"
        quantizations: ["W8A8", "W4A16"]

  llama-3.2-3b-instruct:
    hf_repo: "meta-llama/Llama-3.2-3B-Instruct"
    parameters: "3B"
    runtimes:
      cpu_llamacpp:
        format: "gguf"
        quantizations: ["Q8_0", "Q4_K_M"]
      npu_rkllm:
        format: "rkllm"
        quantizations: ["W8A8", "W4A16"]

evaluation:
  calibration_dir: "datasets/"
  eval_questions_count: 60
  metrics:
    - "peak_ram_mib"
    - "ttft_ms"
    - "decode_tokens_per_sec"
    - "prefill_tokens_per_sec"
    - "quality_score"
